# Career OS pilot — small set of PUBLIC ATS boards (no login), taken from career-ops' portals.example.yml.
title_filter:
  positive: ["Project", "Program", "Process", "Operations", "Manufacturing", "Industrial", "Engineer"]
  negative: ["Intern", "Werkstudent", "Praktikant"]
tracked_companies:
  - name: PhysicsX
    careers_url: https://job-boards.greenhouse.io/physicsx
    api: https://boards-api.greenhouse.io/v1/boards/physicsx/jobs
    enabled: true
  - name: Celonis
    careers_url: https://job-boards.greenhouse.io/celonis
    api: https://boards-api.greenhouse.io/v1/boards/celonis/jobs
    enabled: true
