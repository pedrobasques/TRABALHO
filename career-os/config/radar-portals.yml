# Career OS — profile radar (Sprint 4.5). career-ops portals.yml format; used in an ISOLATED data root.
# Sources verified on 2026-11-05 against their public APIs (HTTP 200 with postings). No login, no scraping.
# Title filter = deterministic level-1/2 triage; finer A/B/C ranking happens in Career OS (packages/core/src/ingest/triage.ts).

